<style>
:root{
  --bg:#f4f2ec; --surface:#ffffff; --surface-2:#eceae2; --text:#1b1b1a; --muted:#6b6a63;
  --accent:#b5860f; --accent-text:#1b1b1a; --active-row:#cfe9ff; --gesamt-bg:#fdeecb; --border:transparent;
  --danger:#a3372c; --good:#3a7d4f; --shadow:0 1px 3px rgba(0,0,0,.08);
}
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    --bg:#14161b; --surface:#1e2129; --surface-2:#262a34; --text:#f2f0e8; --muted:#9aa0ac;
    --accent:#e8b93f; --accent-text:#14161b; --active-row:#1f4a68; --gesamt-bg:#3a3018; --border:transparent;
    --danger:#e2685a; --good:#5fbf7f; --shadow:0 1px 3px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#14161b; --surface:#1e2129; --surface-2:#262a34; --text:#f2f0e8; --muted:#9aa0ac;
  --accent:#e8b93f; --accent-text:#14161b; --active-row:#1f4a68; --gesamt-bg:#3a3018; --border:transparent;
  --danger:#e2685a; --good:#5fbf7f; --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  overscroll-behavior:none; touch-action:manipulation;
  padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom);
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  -webkit-user-select:none; user-select:none;
}
input, textarea{ -webkit-user-select:text; user-select:text; }
button{font-family:inherit;}
.font-num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
#app{min-height:100vh; display:flex; flex-direction:column;}
.top{ display:flex; align-items:center; gap:.5rem; padding:.9rem 1rem; }
.top h1{ font-size:1.05rem; margin:0; flex:1; font-weight:700; letter-spacing:.02em;}
.iconbtn{
  border:none; background:var(--surface); color:var(--text); border-radius:14px;
  width:48px; height:48px; display:flex; align-items:center; justify-content:center;
  transition:transform .12s ease, background .12s ease;
}
.iconbtn:active{ transform:scale(.92); background:var(--surface-2); }
.iconbtn svg{ width:22px; height:22px; }
.btn svg{ width:20px; height:20px; flex-shrink:0; }
.btn{
  border:none; border-radius:16px; padding:1rem 1.2rem; font-size:1.05rem; font-weight:600;
  background:var(--surface); color:var(--text); display:flex; align-items:center; justify-content:center;
  gap:.5rem; min-height:56px; transition:transform .12s ease, background .12s ease; cursor:pointer;
}
.btn:active{ transform:scale(.97); }
.btn-primary{ background:var(--accent); color:var(--accent-text); }
.btn-danger{ background:var(--danger); color:#fff; }
.btn-ghost{ background:transparent; color:var(--muted); min-height:44px; padding:.6rem 1rem; font-weight:500;}
.btn-block{ width:100%; }
.stack{ display:flex; flex-direction:column; gap:.7rem; }
.row{ display:flex; align-items:center; gap:.6rem; }
.card{ background:var(--surface); border-radius:20px; padding:1.1rem; box-shadow:var(--shadow); }
.muted{ color:var(--muted); }
.scr{ flex:1; padding:0 1rem 2rem; display:flex; flex-direction:column; gap:1rem; overflow-y:auto;}
.scr-spiel{ flex:1; padding:0 .6rem calc(.5rem + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:.4rem; overflow:hidden; min-height:0; }
.center-scr{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1rem; padding:2rem 1.2rem;}
.brand{ display:flex; flex-direction:column; align-items:center; gap:.3rem; margin-bottom:1rem;}
.brand .diehero{ width:88px; height:88px; border-radius:22px; background:var(--surface); display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);}
.brand h1{ font-size:1.8rem; margin:.4rem 0 0; }
.startlist{ width:100%; max-width:420px; display:flex; flex-direction:column; gap:.7rem; }

/* Spielblock: vier klar getrennte Zonen (Oben / Zwischensumme+Bonus / Unten /
   Gesamt), die den verfuegbaren Platz per Flex/Grid exakt ausfuellen. So ist
   nie Scrollen noetig - egal ob das iPad hoch oder quer gehalten wird, die
   Zeilen werden einfach proportional kleiner oder groesser. */
.block-stack{ flex:1; display:flex; flex-direction:column; gap:.35rem; min-height:0; }
.block-header{ display:grid; column-gap:.3rem; flex:0 0 auto; }
.block-band{
  display:grid; grid-auto-rows:1fr; column-gap:.3rem; row-gap:1px;
  background:var(--surface); border-radius:14px; box-shadow:var(--shadow);
  overflow:hidden; padding:.15rem .25rem;
}
.block-band.band-oben{ flex:6 1 0; }
.block-band.band-mitte{ flex:2.2 1 0; background:var(--surface-2); }
.block-band.band-unten{ flex:7 1 0; }
.block-band.band-gesamt{ flex:1.7 1 0; background:var(--gesamt-bg); }
.block-cell{ display:flex; align-items:center; justify-content:center; min-width:0; }
.feldname-cell{
  display:flex; align-items:center; gap:.35rem; font-weight:700; font-size:1rem; letter-spacing:-.01em;
  padding-left:.3rem; color:var(--text); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.feld-wuerfel-icon{ width:1.15em; height:1.15em; flex-shrink:0; color:var(--muted); }
.spieler-kopf{ display:flex; flex-direction:column; align-items:center; justify-content:center; gap:0; font-weight:700; border-radius:10px; min-width:0; }
.spieler-kopf .em{ font-size:1.1rem; line-height:1.1; }
.spieler-kopf .nm{ font-size:.68rem; line-height:1.15; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
.kopf-delta{ font-size:.66rem; font-weight:800; line-height:1.2; }
.kopf-delta.gut{ color:var(--good); }
.kopf-delta.schlecht{ color:var(--danger); }
.spalte-aktiv{ background:var(--active-row); border-radius:8px; }
.zelle-btn{
  width:100%; height:100%; border:none; background:transparent; color:var(--text); border-radius:9px;
  font-size:1.02rem; font-weight:700; display:flex; align-items:center; justify-content:center; gap:.2rem; min-width:0;
}
.zelle-btn:active{ background:var(--surface-2); }
.zelle-leer{ color:var(--muted); font-weight:400; }
.zelle-empf{ background:var(--accent); color:var(--accent-text); border-radius:9px; }
.bonus-zelle{ display:flex; align-items:center; justify-content:center; gap:.3rem; flex-wrap:wrap; }
.bonus-erreicht{ color:var(--good); font-weight:800; font-size:1.05rem; }
.bonus-puffer{ font-size:.62rem; color:var(--muted); font-weight:600; }
.gesamt-wert{ font-size:1.4rem; font-weight:800; }
.konfetti-schicht{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:200; }
.konfetti-stueck{
  position:absolute; top:-10vh; left:0; will-change:transform, opacity;
  animation-name:konfetti-fall; animation-timing-function:ease-in; animation-fill-mode:forwards;
}
@keyframes konfetti-fall{
  0%{ transform:translate(0,0) rotate(0deg); opacity:1; }
  100%{ transform:translate(var(--drift), 125vh) rotate(var(--drehung)); opacity:.9; }
}
.modeswitch{ display:flex; background:var(--surface-2); border-radius:14px; padding:4px; gap:4px; flex:0 0 auto; }
.modeswitch button{ flex:1; border:none; background:transparent; color:var(--muted); border-radius:10px; padding:.4rem; font-weight:600; }
.modeswitch button.aktiv{ background:var(--surface); color:var(--text); box-shadow:var(--shadow);}

/* Wuerfelmodus: kompaktes Panel, damit der Block darunter nicht schrumpfen muss */
.wuerfel-panel{ flex:0 0 auto; background:var(--surface); border-radius:14px; box-shadow:var(--shadow); padding:.4rem .5rem; display:flex; flex-direction:column; gap:.3rem; }
.wuerfel-reihe{ display:flex; gap:.4rem; justify-content:center; }
.wuerfel{
  width:15%; max-width:52px; aspect-ratio:1; border-radius:12px; background:var(--surface-2);
  display:flex; align-items:center; justify-content:center; font-size:1.3rem; font-weight:800; color:var(--text);
  border:2px solid transparent;
}
.wuerfel.gehalten{ border-color:var(--accent); color:var(--accent); }
.coach-line{ display:flex; align-items:center; gap:.4rem; flex-wrap:wrap; font-size:.78rem; }
.coach-line.aus{ opacity:.55; }
.coach-line b{ font-weight:700; }
.chip{ display:inline-flex; align-items:center; padding:.2rem .6rem; border-radius:999px; background:var(--surface-2); font-size:.72rem; font-weight:600; white-space:nowrap; }
.werte-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:.6rem; }
.werte-grid button{ border:none; border-radius:14px; padding:1rem .5rem; font-size:1.3rem; font-weight:800; background:var(--surface-2); color:var(--text); min-height:56px; }
.werte-grid button:active{ transform:scale(.95); }

/* Overlay / Modal */
.overlay{ position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:flex-end; justify-content:center; z-index:50; }
.overlay .sheet{ background:var(--bg); width:100%; max-width:480px; border-radius:24px 24px 0 0; padding:1.2rem 1.2rem calc(1.4rem + env(safe-area-inset-bottom)); max-height:88vh; overflow-y:auto; }
.overlay.center{ align-items:center; }
.overlay.center .sheet{ border-radius:22px; max-width:400px; }
.field{ display:flex; flex-direction:column; gap:.35rem; }
.field label{ font-size:.85rem; color:var(--muted); font-weight:600; }
.field input, .field select{
  background:var(--surface); border:none; border-radius:12px; padding:.85rem 1rem; font-size:1rem; color:var(--text);
}
.emoji-grid{ display:grid; grid-template-columns:repeat(6,1fr); gap:.4rem; }
.emoji-grid button{ font-size:1.4rem; background:var(--surface); border:none; border-radius:12px; padding:.5rem 0; }
.emoji-grid button.aktiv{ background:var(--accent); }
.farb-grid{ display:flex; gap:.5rem; flex-wrap:wrap; }
.farb-dot{ width:34px; height:34px; border-radius:50%; border:3px solid transparent; }
.farb-dot.aktiv{ border-color:var(--text); }

table.stat{ width:100%; border-collapse:collapse; font-size:.92rem; }
table.stat th, table.stat td{ padding:.5rem .4rem; text-align:center; }
table.stat th{ color:var(--muted); font-weight:600; text-align:left; }
table.stat td:first-child, table.stat th:first-child{ text-align:left; }
.tabs{ display:flex; gap:.4rem; overflow-x:auto; padding-bottom:.2rem; }
.tabs button{ white-space:nowrap; border:none; background:var(--surface-2); color:var(--muted); border-radius:999px; padding:.5rem 1rem; font-weight:600; }
.tabs button.aktiv{ background:var(--accent); color:var(--accent-text); }
svg.chart text{ fill:var(--muted); font-size:10px; }
.toast{ position:fixed; bottom:calc(1.2rem + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:.7rem 1.1rem; border-radius:14px; font-weight:600; z-index:99; box-shadow:var(--shadow); }
.switch{ position:relative; width:52px; height:30px; border-radius:20px; background:var(--surface-2); flex-shrink:0; }
.switch .knob{ position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:var(--muted); transition:transform .15s ease, background .15s ease; }
.switch.an{ background:var(--accent); }

/* =========================================================================
   LOGIK — reine Funktionen, keine Oberflaeche kennt eine Punkteregel selbst
   ========================================================================= */
const FELDER = [
  { key: 'eins', typ: 'oben', wert: 1 },
  { key: 'zwei', typ: 'oben', wert: 2 },
  { key: 'drei', typ: 'oben', wert: 3 },
  { key: 'vier', typ: 'oben', wert: 4 },
  { key: 'fuenf', typ: 'oben', wert: 5 },
  { key: 'sechs', typ: 'oben', wert: 6 },
  { key: 'dreierpasch', typ: 'unten' },
  { key: 'viererpasch', typ: 'unten' },
  { key: 'fullhouse', typ: 'unten' },
  { key: 'kleinestrasse', typ: 'unten' },
  { key: 'grossestrasse', typ: 'unten' },
  { key: 'kniffel', typ: 'unten' },
  { key: 'chance', typ: 'unten' },
];
const OBERE_FELDER = FELDER.filter(f => f.typ === 'oben').map(f => f.key);
const UNTERE_FELDER = FELDER.filter(f => f.typ === 'unten').map(f => f.key);

const STANDARD_REGELN = {
  kniffelJoker: 'standard',
  zweiterKniffelBonus: 100,
  fullHouseBeiFuenfGleichen: true,
  bonusSchwelle: 63,
  bonusHoehe: 35,
};

function zaehleWuerfel(wuerfel) {
  const c = [0, 0, 0, 0, 0, 0, 0];
  for (const w of wuerfel) c[w]++;
  return c;
}
function summeWuerfel(wuerfel) { return wuerfel.reduce((a, b) => a + b, 0); }
function istKniffelWurf(wuerfel) { return zaehleWuerfel(wuerfel).some(n => n === 5); }
function hatFullHouseMuster(counts) { return counts.includes(3) && counts.includes(2); }
function hatKleineStrasse(counts) {
  const seqs = [[1, 2, 3, 4], [2, 3, 4, 5], [3, 4, 5, 6]];
  return seqs.some(seq => seq.every(z => counts[z] >= 1));
}
function hatGrosseStrasse(counts) {
  const seqs = [[1, 2, 3, 4, 5], [2, 3, 4, 5, 6]];
  return seqs.some(seq => seq.every(z => counts[z] >= 1));
}
function jokerAktiv(wuerfel, karte, regeln) {
  if (!istKniffelWurf(wuerfel)) return false;
  if (karte.felder.kniffel !== 50) return false;
  if (regeln.kniffelJoker === 'aus') return false;
  return true;
}
function erzwungenesOberesFeld(wuerfel, karte, regeln) {
  if (!jokerAktiv(wuerfel, karte, regeln)) return null;
  if (regeln.kniffelJoker !== 'standard') return null;
  const zahl = wuerfel[0];
  const obereSchluessel = OBERE_FELDER[zahl - 1];
  if (karte.felder[obereSchluessel] === null) return obereSchluessel;
  return null;
}
function berechnePunkte(feld, wuerfel, karte, regeln) {
  const counts = zaehleWuerfel(wuerfel);
  const kniffel = istKniffelWurf(wuerfel);
  const joker = jokerAktiv(wuerfel, karte, regeln);
  const obenIndex = OBERE_FELDER.indexOf(feld);
  if (obenIndex !== -1) { const zahl = obenIndex + 1; return counts[zahl] * zahl; }
  switch (feld) {
    case 'dreierpasch': return counts.some(n => n >= 3) ? summeWuerfel(wuerfel) : 0;
    case 'viererpasch': return counts.some(n => n >= 4) ? summeWuerfel(wuerfel) : 0;
    case 'fullhouse': {
      if (hatFullHouseMuster(counts)) return 25;
      if (kniffel && (regeln.fullHouseBeiFuenfGleichen || joker)) return 25;
      return 0;
    }
    case 'kleinestrasse': {
      if (hatKleineStrasse(counts)) return 30;
      if (kniffel && joker) return 30;
      return 0;
    }
    case 'grossestrasse': {
      if (hatGrosseStrasse(counts)) return 40;
      if (kniffel && joker) return 40;
      return 0;
    }
    case 'kniffel': return kniffel ? 50 : 0;
    case 'chance': return summeWuerfel(wuerfel);

    if (offeneUntere.length > 0) return offeneUntere;
    const offeneObere = alleOffenen.filter(k => OBERE_FELDER.includes(k));
    if (offeneObere.length > 0) return offeneObere;

}
function gueltigeWerte(feld) {
  const obenIndex = OBERE_FELDER.indexOf(feld);
  if (obenIndex !== -1) { const zahl = obenIndex + 1; return [0, 1, 2, 3, 4, 5].map(n => n * zahl); }
  switch (feld) {
    case 'dreierpasch': case 'viererpasch': case 'chance': {
      const werte = [0]; for (let s = 5; s <= 30; s++) werte.push(s); return werte;
    }
    case 'fullhouse': return [0, 25];
    case 'kleinestrasse': return [0, 30];
    case 'grossestrasse': return [0, 40];

function summeOben(karte) { return OBERE_FELDER.reduce((s, k) => s + (karte.felder[k] || 0), 0); }
function summeUnten(karte) { return UNTERE_FELDER.reduce((s, k) => s + (karte.felder[k] || 0), 0); }

  regeln = regeln || STANDARD_REGELN;
  const oben = summeOben(karte);
  const fehlt = regeln.bonusSchwelle - oben;
  return { oben, schwelle: regeln.bonusSchwelle, erreicht: oben >= regeln.bonusSchwelle, fehlt: Math.max(0, fehlt), puffer: fehlt < 0 ? -fehlt : 0 };
}

  regeln = regeln || STANDARD_REGELN;
  const oben = summeOben(karte);
  const bonus = hatBonus(karte, regeln) ? regeln.bonusHoehe : 0;
  const unten = summeUnten(karte);

// Erwartungswert-Naeherung fuer den Wuerfel-Coach:
// Gesamtwert(Feld) = Sofortwert + Bonus-Gewicht - Verlustgewicht.
// Bonus-Gewicht schaetzt, wie sehr ein Eintrag hilft, die Bonus-Schwelle zu
// erreichen (staerker, je naeher man dran ist und je weniger obere Felder
// noch offen sind). Verlustgewicht schaetzt den Durchschnittswert, der
// verloren geht, wenn ein eigentlich ergiebiges Feld mit schwachen Wuerfeln
// "verbrannt" wird - gewichtet danach, wie viele Runden noch uebrig sind
// (in der letzten Runde zaehlt nur noch der Sofortwert). Fuer den
// Nachwurf (wurfNummer 1/2) wird der Erwartungswert jeder Behalten-Maske
// exakt per Kombinatorik ueber alle moeglichen Wuerfe der uebrigen Wuerfel
// berechnet (6^k Ergebnisse, k = Anzahl neu zu wuerfelnder Wuerfel) und
// jeweils mit obigem Gesamtwert bewertet - eine vollstaendige Simulation
// ueber alle Restkarten waere auf dem Handy unnoetig teuer.
const DURCHSCHNITTSWERT = {
  eins: 2.3, zwei: 4.7, drei: 7.0, vier: 9.3, fuenf: 11.7, sechs: 14.0,
  dreierpasch: 21, viererpasch: 14, fullhouse: 18, kleinestrasse: 20,
  grossestrasse: 14, kniffel: 3, chance: 21,
};
function feldWert(feld) { const i = OBERE_FELDER.indexOf(feld); return i !== -1 ? i + 1 : null; }
function gesamtwertFuerFeld(feld, wuerfel, karte, regeln) {
  const sofort = berechnePunkte(feld, wuerfel, karte, regeln);
  const restRunden = anzahlOffenerFelder(karte);
  const restGewicht = Math.max(0, (restRunden - 1) / 12);
  let bonusGewicht = 0;
  const zahl = feldWert(feld);
  if (zahl !== null) {
    const stand = bonusStand(karte, regeln);
    if (!stand.erreicht) {
      const offeneObere = OBERE_FELDER.filter(k => karte.felder[k] === null).length || 1;
      const ziel = zahl * 3;
      const anteil = Math.max(0, Math.min(1.4, sofort / ziel));
      bonusGewicht = (regeln.bonusHoehe / offeneObere) * anteil;
    }
  }
  const durchschnitt = DURCHSCHNITTSWERT[feld] || 0;
  const verlust = Math.max(0, durchschnitt - sofort) * restGewicht * 0.5;
  return sofort + bonusGewicht - verlust;
}
function bestenGesamtwert(wuerfel, karte, regeln) {
  const ziele = gueltigeZielfelder(wuerfel, karte, regeln);
  let max = -Infinity;
  for (const feld of ziele) { const w = gesamtwertFuerFeld(feld, wuerfel, karte, regeln); if (w > max) max = w; }
  return max === -Infinity ? 0 : max;
}
function erwartungswertFuerMaske(mask, wuerfel, karte, regeln) {
  const behalten = wuerfel.filter((_, i) => mask[i]);
  const anzahlNeu = 5 - behalten.length;
  if (anzahlNeu === 0) return bestenGesamtwert(wuerfel, karte, regeln);
  let summe = 0, anzahl = 0;
  const kombis = Math.pow(6, anzahlNeu);
  for (let k = 0; k < kombis; k++) {
    const neue = []; let rest = k;
    for (let i = 0; i < anzahlNeu; i++) { neue.push((rest % 6) + 1); rest = Math.floor(rest / 6); }
    summe += bestenGesamtwert(behalten.concat(neue), karte, regeln);
    anzahl++;
  }
  return summe / anzahl;
}
function besteBehalteKombination(wuerfel, karte, regeln) {
  let beste = null;
  for (let m = 0; m < 32; m++) {
    const mask = [0, 1, 2, 3, 4].map(i => !!(m & (1 << i)));
    const ev = erwartungswertFuerMaske(mask, wuerfel, karte, regeln);
    if (!beste || ev > beste.ev) beste = { mask, ev };
  }

}

  regeln = regeln || STANDARD_REGELN;
  const ziele = gueltigeZielfelder(wuerfel, karte, regeln);
  if (ziele.length === 0) return null;
  const bewertet = ziele.map(feld => ({
    feld, sofort: berechnePunkte(feld, wuerfel, karte, regeln), gesamtwert: gesamtwertFuerFeld(feld, wuerfel, karte, regeln),
  })).sort((a, b) => b.gesamtwert - a.gesamtwert);
  const beste = bewertet[0];
  const streichEmpfehlung = bewertet.every(b => b.sofort === 0);
  const ergebnis = { feldEmpfehlung: beste.feld, sofortwert: beste.sofort, streichen: streichEmpfehlung, alle: bewertet };
  if (wurfNummer === 1 || wurfNummer === 2) ergebnis.behalteEmpfehlung = besteBehalteKombination(wuerfel, karte, regeln);
  return ergebnis;
}

<script>/* =========================================================================
   SPEICHER-ADAPTER — nutzt window.storage falls vorhanden, sonst localStorage
   ========================================================================= */
const SCHLUESSEL = {
  spieler: 'kniffel_spieler', spiele: 'kniffel_spiele', aktiv: 'kniffel_aktiv',
  einstellungen: 'kniffel_einstellungen', presets: 'kniffel_presets',
};
const Store = {
  async get(key, fallback) {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        const v = await window.storage.get(key);
        if (v !== undefined && v !== null) return v;
      }
    } catch (e) { /* weiter mit localStorage */ }
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) { return fallback; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        await window.storage.set(key, value);
        return;
      }
    } catch (e) { /* weiter mit localStorage */ }
    try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* Speicher voll o.ae. */ }
  },
  async list(prefix) {
    try {
      if (window.storage && typeof window.storage.list === 'function') return await window.storage.list(prefix);
    } catch (e) { /* weiter */ }
    try {
      const out = [];
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(prefix) === 0) out.push(k); }
      return out;
    } catch (e) { return []; }
  },
};

/* =========================================================================
   HILFSFUNKTIONEN
   ========================================================================= */
function klon(o) { return JSON.parse(JSON.stringify(o)); }
function neueId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 9); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function formatDatum(ts) { const d = new Date(ts); return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
function spielerById(id) { return SPIELER.find(s => s.id === id) || { name: '?', emoji: '❓', farbe: '#888' }; }
function haptic(stark) { if (!EINSTELLUNGEN.haptik) return; try { if (navigator.vibrate) navigator.vibrate(stark ? 25 : 10); } catch (e) { /* nicht verfuegbar */ } }
let toastTimer = null;
function toast(text) {
  let el = document.getElementById('toast');
  if (!el) { el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = text; el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2200);
}
function anwendenTheme() {
  const root = document.documentElement;
  if (EINSTELLUNGEN.darstellung === 'hell') root.setAttribute('data-theme', 'light');
  else if (EINSTELLUNGEN.darstellung === 'dunkel') root.setAttribute('data-theme', 'dark');
  else root.removeAttribute('data-theme');
}

/* =========================================================================
   SPEICHERN
   ========================================================================= */
async function speichereAlles() {
  await Promise.all([
    Store.set(SCHLUESSEL.spieler, SPIELER),
    Store.set(SCHLUESSEL.spiele, SPIELE),
    Store.set(SCHLUESSEL.aktiv, AKTIV),
    Store.set(SCHLUESSEL.einstellungen, EINSTELLUNGEN),

}
async function speichereAktiv() { await Store.set(SCHLUESSEL.aktiv, AKTIV); }
async function speichereEinstellungen() { await Store.set(SCHLUESSEL.einstellungen, EINSTELLUNGEN); }

/* =========================================================================
   SPIEL-LOGIK (Zustandsmutationen, greifen ausschliesslich auf die reinen
   Funktionen oben zu — keine Punkteregel wird hier neu erfunden)
   ========================================================================= */
function karteLeer() {
  const felder = {}; FELDER.forEach(f => felder[f.key] = null);
  return { felder, kniffelBonusAnzahl: 0, wuerfeLog: [] };
}
function neuesSpielErstellen(spielerIds, regeln) {
  const karten = {};
  spielerIds.forEach(id => karten[id] = karteLeer());
  AKTIV = {
    id: neueId(), erstelltAm: Date.now(), beendetAm: null, beendet: false,
    regeln: klon(regeln), reihenfolge: spielerIds.slice(), amZugIndex: 0,
    modus: 'schnell', wurfNummer: 1, wuerfel: [1, 1, 1, 1, 1], wuerfelEingegeben: false,
    karten, verlaufsStapel: [],
  };
}
function aktiverSpielerId() { return AKTIV.reihenfolge[AKTIV.amZugIndex]; }
function aktiveKarte() { return AKTIV.karten[aktiverSpielerId()]; }

function schnappschussSpeichern() {
  AKTIV.verlaufsStapel.push(klon({ karten: AKTIV.karten, amZugIndex: AKTIV.amZugIndex, wurfNummer: AKTIV.wurfNummer, wuerfel: AKTIV.wuerfel, wuerfelEingegeben: AKTIV.wuerfelEingegeben }));
  if (AKTIV.verlaufsStapel.length > 10) AKTIV.verlaufsStapel.shift();
}
async function undoSchritt() {
  if (!AKTIV || AKTIV.verlaufsStapel.length === 0) { toast('Kein Schritt zum Rückgängigmachen.'); return; }
  const letzter = AKTIV.verlaufsStapel.pop();
  AKTIV.karten = letzter.karten; AKTIV.amZugIndex = letzter.amZugIndex;
  AKTIV.wurfNummer = letzter.wurfNummer; AKTIV.wuerfel = letzter.wuerfel; AKTIV.wuerfelEingegeben = letzter.wuerfelEingegeben;
  await speichereAktiv(); render(); haptic();
}
function naechsterSpieler() {
  AKTIV.amZugIndex = (AKTIV.amZugIndex + 1) % AKTIV.reihenfolge.length;
  AKTIV.wurfNummer = 1; AKTIV.wuerfel = [1, 1, 1, 1, 1]; AKTIV.wuerfelEingegeben = false;
}
async function eintragenSchnell(feld, wert) {
  schnappschussSpeichern();

  karte.felder[feld] = wert;
  if (feld === 'kniffel' && wert === 50) zeigeKniffelKonfetti();
  naechsterSpieler();
  await nachEintragPruefen();
}
async function eintragenWuerfel(feld) {
  const karte = aktiveKarte();
  const wuerfel = AKTIV.wuerfel.slice();
  const regeln = AKTIV.regeln;
  const gueltig = gueltigeZielfelder(wuerfel, karte, regeln);
  if (!gueltig.includes(feld)) return;
  schnappschussSpeichern();
  const punkte = berechnePunkte(feld, wuerfel, karte, regeln);
  const bonus = kniffelBonusPunkte(wuerfel, karte, regeln);
  const empf = empfehlung(wuerfel, karte, regeln, AKTIV.wurfNummer);
  karte.felder[feld] = punkte;
  if (bonus > 0) karte.kniffelBonusAnzahl = (karte.kniffelBonusAnzahl || 0) + 1;
  if ((feld === 'kniffel' && punkte === 50) || bonus > 0) zeigeKniffelKonfetti();
  karte.wuerfeLog.push({
    wuerfel, gewaehltesFeld: feld, sofortGewaehlt: punkte,
    empfehlungsFeld: empf ? empf.feldEmpfehlung : null, sofortEmpfehlung: empf ? empf.sofortwert : null,
  });
  naechsterSpieler();
  await nachEintragPruefen();
}
// Konfetti-Explosion bei einem Kniffel: 100 🎉-Emoji fallen ueber ca. 3
// Sekunden vom oberen Bildschirmrand nach unten aus dem Bild, mit
// zufaelliger Startposition, Drift, Drehung und leicht versetztem Start
// fuer einen natuerlichen "Explosions"-Effekt.
function zeigeKniffelKonfetti() {
  const schicht = document.createElement('div');
  schicht.className = 'konfetti-schicht';
  for (let i = 0; i < 100; i++) {
    const stueck = document.createElement('span');
    stueck.className = 'konfetti-stueck';
    stueck.textContent = '🎉';
    const startX = Math.random() * 100;
    const drift = (Math.random() - 0.5) * 50;
    const dauer = 2.4 + Math.random() * 0.4;
    const verzoegerung = Math.random() * 0.3;
    const groesse = 1 + Math.random() * 1.3;
    const drehung = (Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 720);
    stueck.style.left = startX + 'vw';
    stueck.style.fontSize = groesse + 'rem';
    stueck.style.setProperty('--drift', drift + 'vw');
    stueck.style.setProperty('--drehung', drehung + 'deg');
    stueck.style.animationDuration = dauer + 's';
    stueck.style.animationDelay = verzoegerung + 's';
    schicht.appendChild(stueck);
  }
  document.body.appendChild(schicht);
  setTimeout(() => schicht.remove(), 3300);
}
async function nachEintragPruefen() {
  const alleVoll = AKTIV.reihenfolge.every(id => karteIstVoll(AKTIV.karten[id]));

}

/* =========================================================================

function render() {

/* ---------- Neues Spiel ---------- */

/* ---------- Spielblock (Hauptbildschirm) ---------- */
const BLOCK_BAENDE = [
  { klasse: 'band-oben', zeilen: [
    { typ: 'feld', key: 'eins' }, { typ: 'feld', key: 'zwei' }, { typ: 'feld', key: 'drei' },
    { typ: 'feld', key: 'vier' }, { typ: 'feld', key: 'fuenf' }, { typ: 'feld', key: 'sechs' },
  ] },
  { klasse: 'band-mitte', zeilen: [{ typ: 'zwischensumme' }, { typ: 'bonus' }] },
  { klasse: 'band-unten', zeilen: [
    { typ: 'feld', key: 'dreierpasch' }, { typ: 'feld', key: 'viererpasch' }, { typ: 'feld', key: 'fullhouse' },
    { typ: 'feld', key: 'kleinestrasse' }, { typ: 'feld', key: 'grossestrasse' },
    { typ: 'feld', key: 'kniffel' }, { typ: 'feld', key: 'chance' },
  ] },
  { klasse: 'band-gesamt', zeilen: [{ typ: 'gesamt' }] },
];
function aktuelleEmpfehlung() {
  if (!AKTIV || AKTIV.modus !== 'wuerfel' || !AKTIV.wuerfelEingegeben) return null;
  return empfehlung(AKTIV.wuerfel, aktiveKarte(), AKTIV.regeln, AKTIV.wurfNummer);
}
// Tempo-Anzeige im oberen Teil: im Schnitt braucht man drei Wuerfel einer
// Zahl, um am Ende auf die 63 zu kommen (3x(1+2+3+4+5+6)=63). Die Differenz
// zum eingetragenen Wert zeigt, ob ein Feld den Bonus naeher gebracht oder
// gekostet hat, z. B. eine einzelne 1 im Einser-Feld => 1-3 = -2. Angezeigt
// wird nicht pro Feld, sondern aufsummiert ueber alle bereits eingetragenen
// oberen Felder direkt neben dem Spielernamen - noch offene Felder zaehlen
// dabei nicht mit.
function paceDelta(feld, wert) {
  const zahl = feldWert(feld);
  return zahl === null ? null : wert - zahl * 3;
}
function kumulierterTempoDelta(karte) {
  return OBERE_FELDER.reduce((summe, feld) => {
    const wert = karte.felder[feld];
    return wert === null ? summe : summe + paceDelta(feld, wert);
  }, 0);
}
function alleObereGefuellt(karte) {
  return OBERE_FELDER.every(k => karte.felder[k] !== null);
}
// Kleines Wuerfel-Icon mit der passenden Augenzahl, nur fuer die Feldnamen
// im oberen Teil (Einser..Sechser) - im unteren Teil gibt es keine feste
// Augenzahl, dort steht nur der Name.
function wuerfelIconSvg(n) {
  const positionen = {
    1: [[50, 50]],
    2: [[30, 30], [70, 70]],
    3: [[30, 30], [50, 50], [70, 70]],
    4: [[30, 30], [70, 30], [30, 70], [70, 70]],
    5: [[30, 30], [70, 30], [50, 50], [30, 70], [70, 70]],
    6: [[30, 26], [70, 26], [30, 50], [70, 50], [30, 74], [70, 74]],
  };
  const pips = (positionen[n] || []).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="9" fill="currentColor"/>`).join('');
  return `<svg class="feld-wuerfel-icon" viewBox="0 0 100 100" aria-hidden="true"><rect x="5" y="5" width="90" height="90" rx="20" fill="none" stroke="currentColor" stroke-width="8"/>${pips}</svg>`;
}
function zelleFeldInhalt(id, key, ist, karte, regeln, gueltigZiel, empf) {
  const wert = karte.felder[key];
  if (wert !== null) {
    return `<button class="zelle-btn font-num" data-longaction="feld-korrektur" data-id="${id}" data-feld="${key}">${wert}</button>`;
  }
  if (!ist) return `<span class="zelle-leer">–</span>`;
  if (AKTIV.modus === 'schnell') return `<button class="zelle-btn zelle-leer" data-action="feld-tippen-schnell" data-feld="${key}">–</button>`;
  if (!AKTIV.wuerfelEingegeben) return `<span class="zelle-leer">–</span>`;
  if (gueltigZiel.includes(key)) {
    const punkte = berechnePunkte(key, AKTIV.wuerfel, karte, regeln);
    const hervorheben = EINSTELLUNGEN.coach && empf && empf.feldEmpfehlung === key;
    return `<button class="zelle-btn font-num ${hervorheben ? 'zelle-empf' : ''}" data-action="feld-tippen-wuerfel" data-feld="${key}">${punkte}</button>`;
  }
  return `<span class="zelle-leer" style="opacity:.3;">–</span>`;
}
SCREENS.spiel = function () {
  if (!AKTIV) { BILDSCHIRM = 'start'; return SCREENS.start(); }
  const regeln = AKTIV.regeln;
  const amZugId = aktiverSpielerId();
  const empf = aktuelleEmpfehlung();
  const gueltigZiel = AKTIV.modus === 'wuerfel' && AKTIV.wuerfelEingegeben
    ? gueltigeZielfelder(AKTIV.wuerfel, aktiveKarte(), regeln) : [];
  const gridCols = `minmax(76px,1.3fr) repeat(${AKTIV.reihenfolge.length},1fr)`;

  const kopfZellen = AKTIV.reihenfolge.map(id => {

  function zeileHtml(zeile) {

    if (zeile.typ === 'zwischensumme') {

      return `<div class="feldname-cell">${esc(TEXTE.feld.zwischensumme)}</div>${zellen}`;
    }
    if (zeile.typ === 'bonus') {
      const zellen = AKTIV.reihenfolge.map(id => {
        const karte = AKTIV.karten[id];
        const st = bonusStand(karte, regeln);
        let inhalt;
        if (st.erreicht) {
          inhalt = `<div class="bonus-zelle"><span class="bonus-erreicht font-num">+${regeln.bonusHoehe}</span>${st.puffer > 0 ? `<span class="bonus-puffer font-num">${esc(TEXTE.block.puffer(st.puffer))}</span>` : ''}</div>`;
        } else if (alleObereGefuellt(karte)) {

        return `<div class="block-cell ${id === amZugId ? 'spalte-aktiv' : ''}">${inhalt}</div>`;
      }).join('');
      return `<div class="feldname-cell">${esc(TEXTE.feld.bonus)}</div>${zellen}`;
    }
    const zellen = AKTIV.reihenfolge.map(id => `<div class="block-cell gesamt-wert font-num ${id === amZugId ? 'spalte-aktiv' : ''}">${gesamtSumme(AKTIV.karten[id], regeln).gesamt}</div>`).join('');

  const wuerfelPanel = AKTIV.modus !== 'wuerfel' ? '' : `
    <div class="wuerfel-panel">
      <div class="wuerfel-reihe">
        ${AKTIV.wuerfel.map((w, i) => {
          const behalten = empf && empf.behalteEmpfehlung && EINSTELLUNGEN.coach && empf.behalteEmpfehlung.mask[i];
          return `<button class="wuerfel ${behalten ? 'gehalten' : ''}" data-action="wuerfel-tippen" data-longaction="wuerfel-runter" data-index="${i}">${w}</button>`;
        }).join('')}
      </div>
      <div class="row" style="justify-content:center;flex-wrap:wrap;gap:.4rem;">
        <span class="chip font-num">${esc(TEXTE.wuerfel.wurf(AKTIV.wurfNummer))}</span>
        ${AKTIV.wurfNummer < 3 ? `<button class="btn" style="min-height:34px;padding:.4rem .8rem;font-size:.85rem;" data-action="wuerfel-naechster-wurf">${esc(TEXTE.wuerfel.naechsterWurf)}</button>` : `<span class="chip">${esc(TEXTE.wuerfel.letzterWurf)}</span>`}
      </div>
      ${coachLineHtml(empf)}
    </div>`;

  return `
  <div class="top" style="padding:.5rem 1rem;">

    <h1 style="font-size:.95rem;">${esc(TEXTE.allg.amZug(spielerById(amZugId).name))}</h1>
    <button class="iconbtn" data-action="undo" ${AKTIV.verlaufsStapel.length === 0 ? 'style="opacity:.35"' : ''}>${ICONS.undo}</button>
  </div>
  <div class="scr-spiel">
    <div class="modeswitch">
      <button class="${AKTIV.modus === 'schnell' ? 'aktiv' : ''}" data-action="modus-schnell">${esc(TEXTE.block.schnell)}</button>
      <button class="${AKTIV.modus === 'wuerfel' ? 'aktiv' : ''}" data-action="modus-wuerfel">${esc(TEXTE.block.wuerfel)}</button>
    </div>

function coachLineHtml(empf) {
  if (!EINSTELLUNGEN.coach) return `<div class="coach-line aus muted">${esc(TEXTE.wuerfel.coachAus)}</div>`;

  else satz = TEXTE.wuerfel.guterWert(TEXTE.feld[empf.feldEmpfehlung]);

/* ---------- Spielende ---------- */
function highlightsFuerSpiel(spiel) {
  const out = {};
  spiel.reihenfolge.forEach(id => {
    const karte = spiel.karten[id];
    const regeln = spiel.regeln;
    const hl = [];
    const kniffelAnzahl = (karte.felder.kniffel === 50 ? 1 : 0) + (karte.kniffelBonusAnzahl || 0);
    if (kniffelAnzahl >= 2) hl.push(TEXTE.ende.hlKniffel(kniffelAnzahl));
    const st = bonusStand(karte, regeln);
    if (st.erreicht) hl.push(TEXTE.ende.hlBonusErreicht);
    else if (st.fehlt > 0 && st.fehlt <= 10) hl.push(TEXTE.ende.hlBonusVerpasst(st.fehlt));
    const gesamt = gesamtSumme(karte, regeln).gesamt;
    const bisherigeSpiele = SPIELE.filter(sp => sp.id !== spiel.id && sp.reihenfolge.includes(id));
    const bisherMax = bisherigeSpiele.reduce((m, sp) => Math.max(m, gesamtSumme(sp.karten[id], sp.regeln).gesamt), -Infinity);
    if (bisherigeSpiele.length === 0 || gesamt > bisherMax) hl.push(TEXTE.ende.hlBestleistung);
    out[id] = hl;
  });
  return out;
}

function zeichneErgebnisBild(spiel) {
  const c = document.getElementById('ergebnisCanvas');
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  const ergebnisse = spiel.reihenfolge.map(id => ({ id, s: spielerById(id), gesamt: gesamtSumme(spiel.karten[id], spiel.regeln).gesamt }))
    .sort((a, b) => b.gesamt - a.gesamt);
  const highlights = highlightsFuerSpiel(spiel);
  ctx.fillStyle = '#14161b'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#e8b93f';
  ctx.font = '700 64px -apple-system, sans-serif';
  ctx.fillText('Kniffel', 70, 130);
  ctx.fillStyle = '#9aa0ac'; ctx.font = '400 30px -apple-system, sans-serif';
  ctx.fillText(formatDatum(spiel.beendetAm || Date.now()), 70, 175);
  ctx.fillStyle = '#f2f0e8'; ctx.font = '700 46px -apple-system, sans-serif';
  ctx.fillText(`${ergebnisse[0].s.name} gewinnt!`, 70, 260);

  let y = 350;
  ergebnisse.forEach((e, i) => {
    ctx.fillStyle = i === 0 ? '#e8b93f' : '#f2f0e8';

    ctx.textAlign = 'right';

    y += 20;

  ctx.fillStyle = '#6b6a63'; ctx.font = '400 24px -apple-system, sans-serif';
  ctx.fillText('Erstellt mit der Kniffel-App', 70, H - 50);

}

/* ---------- Bestenliste / Analyse ---------- */
let BEST_ZEITRAUM = 'alle';
let BEST_TAB = 'tabelle';
function spieleImZeitraum() {
  const jetzt = Date.now();
  return SPIELE.filter(sp => {
    if (BEST_ZEITRAUM === 'alle') return true;
    const d = new Date(sp.beendetAm || sp.erstelltAm);
    const n = new Date(jetzt);
    if (BEST_ZEITRAUM === 'jahr') return d.getFullYear() === n.getFullYear();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth();
  });
}
function statistikProSpieler(spiele) {
  const map = {};
  SPIELER.forEach(s => map[s.id] = { spieler: s, spiele: 0, siege: 0, summe: 0, beste: 0, bonusTreffer: 0, kniffelGesamt: 0, gestrichen: {}, feldSumme: {}, feldAnzahl: {} });
  spiele.forEach(sp => {
    const ergebnisse = sp.reihenfolge.map(id => ({ id, gesamt: gesamtSumme(sp.karten[id], sp.regeln).gesamt }));
    const maxGesamt = Math.max(...ergebnisse.map(e => e.gesamt));
    sp.reihenfolge.forEach(id => {
      if (!map[id]) return;
      const karte = sp.karten[id]; const m = map[id];
      m.spiele++;
      const gesamt = gesamtSumme(karte, sp.regeln).gesamt;
      m.summe += gesamt; m.beste = Math.max(m.beste, gesamt);
      if (gesamt === maxGesamt) m.siege++;
      if (bonusStand(karte, sp.regeln).erreicht) m.bonusTreffer++;
      m.kniffelGesamt += (karte.felder.kniffel === 50 ? 1 : 0) + (karte.kniffelBonusAnzahl || 0);
      FELDER.forEach(f => {
        const w = karte.felder[f.key];
        if (w !== null) {
          m.feldSumme[f.key] = (m.feldSumme[f.key] || 0) + w;
          m.feldAnzahl[f.key] = (m.feldAnzahl[f.key] || 0) + 1;
          if (w === 0) m.gestrichen[f.key] = (m.gestrichen[f.key] || 0) + 1;
        }
      });
    });
  });
  return map;
}
function svgLinienchart(reihen, breite, hoehe) {
  const alleWerte = reihen.flatMap(r => r.werte);
  if (alleWerte.length === 0) return `<p class="muted">${esc(TEXTE.best.keineDaten)}</p>`;
  const max = Math.max(...alleWerte, 1), min = Math.min(...alleWerte, 0);
  const pad = 24;
  const maxLen = Math.max(...reihen.map(r => r.werte.length), 1);
  const x = i => pad + (maxLen <= 1 ? 0 : (breite - 2 * pad) * (i / (maxLen - 1)));
  const y = v => hoehe - pad - (hoehe - 2 * pad) * ((v - min) / Math.max(1, (max - min)));
  const linien = reihen.map(r => {
    if (r.werte.length === 0) return '';
    const pts = r.werte.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
    const punkte = r.werte.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.5" fill="${r.farbe}"></circle>`).join('');
    return `<polyline points="${pts}" fill="none" stroke="${r.farbe}" stroke-width="2.5"></polyline>${punkte}`;
  }).join('');
  return `<svg class="chart" viewBox="0 0 ${breite} ${hoehe}" style="width:100%;height:auto;">${linien}</svg>`;
}
SCREENS.bestenliste = function () {
  const spiele = spieleImZeitraum();
  const stats = statistikProSpieler(spiele);
  const liste = Object.values(stats).filter(s => s.spiele > 0).sort((a, b) => b.siege - a.siege || b.summe - a.summe);
  const tabsZeit = ['monat', 'jahr', 'alle'].map(z => `<button class="${BEST_ZEITRAUM === z ? 'aktiv' : ''}" data-action="best-zeitraum" data-wert="${z}">${esc(TEXTE.best.zeitraum[z])}</button>`).join('');
  const tabsAnsicht = [['tabelle', 'Tabelle'], ['verlauf', TEXTE.best.verlauf], ['felder', TEXTE.best.felder], ['wuerfel', TEXTE.best.wuerfelstats]]
    .map(([k, l]) => `<button class="${BEST_TAB === k ? 'aktiv' : ''}" data-action="best-tab" data-wert="${k}">${esc(l)}</button>`).join('');

  let inhalt = '';
  if (spiele.length === 0) {
    inhalt = `<p class="muted">${esc(TEXTE.best.keineDaten)}</p>`;
  } else if (BEST_TAB === 'tabelle') {
    const zeilen = liste.map(s => `<tr>
      <td>${s.spieler.emoji} ${esc(s.spieler.name)}</td>
      <td class="font-num">${s.spiele}</td><td class="font-num">${s.siege}</td>
      <td class="font-num">${Math.round((s.siege / s.spiele) * 100)}%</td>
      <td class="font-num">${Math.round(s.summe / s.spiele)}</td>
      <td class="font-num">${s.beste}</td>
    </tr>`).join('');
    inhalt = `<div class="card" style="overflow-x:auto;"><table class="stat">
      <tr><th></th><th>${esc(TEXTE.best.spiele)}</th><th>${esc(TEXTE.best.siege)}</th><th>${esc(TEXTE.best.quote)}</th><th>${esc(TEXTE.best.schnitt)}</th><th>${esc(TEXTE.best.beste)}</th></tr>
      ${zeilen}</table></div>`;
  } else if (BEST_TAB === 'verlauf') {
    const reihen = liste.map(s => ({
      farbe: s.spieler.farbe,
      werte: spiele.filter(sp => sp.reihenfolge.includes(s.spieler.id)).sort((a, b) => a.beendetAm - b.beendetAm).map(sp => gesamtSumme(sp.karten[s.spieler.id], sp.regeln).gesamt),
    }));
    const legende = liste.map(s => `<span class="chip" style="border-left:4px solid ${s.spieler.farbe};">${s.spieler.emoji} ${esc(s.spieler.name)}</span>`).join(' ');
    inhalt = `<div class="card stack"><div class="row" style="flex-wrap:wrap;">${legende}</div>${svgLinienchart(reihen, 600, 260)}</div>`;
  } else if (BEST_TAB === 'felder') {
    inhalt = liste.map(s => {
      const felderZeilen = FELDER.map(f => {
        const schnitt = s.feldAnzahl[f.key] ? (s.feldSumme[f.key] / s.feldAnzahl[f.key]) : null;
        return `<tr><td>${esc(TEXTE.feld[f.key])}</td><td class="font-num">${schnitt !== null ? schnitt.toFixed(1) : '–'}</td><td class="font-num">${s.gestrichen[f.key] || 0}</td></tr>`;
      }).join('');
      return `<div class="card stack">
        <div class="row"><span class="em">${s.spieler.emoji}</span><b>${esc(s.spieler.name)}</b></div>
        <div class="row" style="justify-content:space-between;"><span class="muted">${esc(TEXTE.best.bonusQuote)}</span><span class="font-num">${Math.round((s.bonusTreffer / s.spiele) * 100)}%</span></div>
        <div class="row" style="justify-content:space-between;"><span class="muted">${esc(TEXTE.best.anzahlKniffel)}</span><span class="font-num">${s.kniffelGesamt}</span></div>
        <table class="stat"><tr><th>${esc(TEXTE.best.felder)}</th><th>Ø</th><th>${esc(TEXTE.best.gestrichenAls)}</th></tr>${felderZeilen}</table>
      </div>`;
    }).join('');
  } else if (BEST_TAB === 'wuerfel') {
    const mitWuerfeldaten = liste.filter(s => spiele.some(sp => (sp.karten[s.spieler.id].wuerfeLog || []).length > 0));
    if (mitWuerfeldaten.length === 0) inhalt = `<p class="muted">${esc(TEXTE.best.keineWuerfeldaten)}</p>`;
    else inhalt = mitWuerfeldaten.map(s => {
      const augen = [0, 0, 0, 0, 0, 0, 0];
      let istSumme = 0, waereSumme = 0, zuege = 0;
      spiele.forEach(sp => (sp.karten[s.spieler.id].wuerfeLog || []).forEach(log => {
        log.wuerfel.forEach(w => augen[w]++);
        istSumme += log.sofortGewaehlt; waereSumme += (log.sofortEmpfehlung !== null ? log.sofortEmpfehlung : log.sofortGewaehlt);
        zuege++;
      }));
      const augenHtml = [1, 2, 3, 4, 5, 6].map(z => `<div class="row" style="justify-content:space-between;"><span>${z}</span><span class="font-num">${augen[z]}</span></div>`).join('');
      return `<div class="card stack">
        <div class="row"><span class="em">${s.spieler.emoji}</span><b>${esc(s.spieler.name)}</b></div>
        <div class="gruppen-titel">${esc(TEXTE.best.augenHaeufigkeit)}</div>
        ${augenHtml}
        ${zuege > 0 ? `<div class="muted" style="margin-top:.4rem;">${esc(TEXTE.best.coachVergleich(istSumme, waereSumme))}</div>` : ''}
      </div>`;
    }).join('');
  }

  return `
  ${topbar(TEXTE.best.titel, '', 'nav-start')}
  <div class="scr">
    <div class="tabs">${tabsZeit}</div>
    <div class="tabs">${tabsAnsicht}</div>
    ${inhalt}
  </div>`;
};

async function datenImportierenAusDatei(datei) {
  try {

async function handleAction(action, el) {
  const id = el.dataset.id, feld = el.dataset.feld, wert = el.dataset.wert, index = el.dataset.index;
  switch (action) {
    case 'start-neu':
      NEU_AUSWAHL = []; NEU_REGELN = klon(STANDARD_REGELN); NEU_REGELN_PRESET = 'standard';
      BILDSCHIRM = 'neu'; render(); break;
    case 'start-fortsetzen': BILDSCHIRM = 'spiel'; render(); break;
    case 'start-bestenliste': BEST_ZEITRAUM = 'alle'; BEST_TAB = 'tabelle'; BILDSCHIRM = 'bestenliste'; render(); break;
    case 'start-spieler': BILDSCHIRM = 'spieler'; render(); break;
    case 'start-einstellungen': BILDSCHIRM = 'einstellungen'; render(); break;
    case 'nav-start': BILDSCHIRM = 'start'; render(); break;

    case 'neu-toggle-spieler': {
      const i = NEU_AUSWAHL.indexOf(id);
      if (i === -1) NEU_AUSWAHL.push(id); else NEU_AUSWAHL.splice(i, 1);
      render(); break;
    }
    case 'neu-rauf': {
      const i = NEU_AUSWAHL.indexOf(id);
      if (i > 0) { [NEU_AUSWAHL[i - 1], NEU_AUSWAHL[i]] = [NEU_AUSWAHL[i], NEU_AUSWAHL[i - 1]]; render(); }
      break;
    }
    case 'neu-runter': {
      const i = NEU_AUSWAHL.indexOf(id);
      if (i !== -1 && i < NEU_AUSWAHL.length - 1) { [NEU_AUSWAHL[i + 1], NEU_AUSWAHL[i]] = [NEU_AUSWAHL[i], NEU_AUSWAHL[i + 1]]; render(); }
      break;
    }
    case 'neu-preset-speichern': zeigeOverlayPresetSpeichern(); break;
    case 'neu-starten': {
      if (NEU_AUSWAHL.length === 0) break;
      neuesSpielErstellen(NEU_AUSWAHL, NEU_REGELN);
      await speichereAlles();
      BILDSCHIRM = 'spiel'; render();
      break;
    }
    case 'regel-fullhouse': NEU_REGELN.fullHouseBeiFuenfGleichen = !NEU_REGELN.fullHouseBeiFuenfGleichen; render(); break;

    case 'spieler-neu-modal': zeigeOverlaySpielerForm(null); break;
    case 'spieler-bearbeiten': zeigeOverlaySpielerForm(id); break;
    case 'spieler-form-emoji': sichereFormularEingaben(); SPIELER_FORMULAR.emoji = wert; renderSpielerFormular(SPIELER.some(s => s.id === SPIELER_FORMULAR.id)); break;
    case 'spieler-form-farbe': sichereFormularEingaben(); SPIELER_FORMULAR.farbe = wert; renderSpielerFormular(SPIELER.some(s => s.id === SPIELER_FORMULAR.id)); break;
    case 'spieler-form-speichern': {
      const input = document.getElementById('spielerNameInput');
      const name = input ? input.value.trim() : '';
      if (!name) { toast('Bitte einen Namen eingeben.'); break; }
      SPIELER_FORMULAR.name = name;
      const bestehenderIndex = SPIELER.findIndex(s => s.id === SPIELER_FORMULAR.id);
      if (bestehenderIndex !== -1) SPIELER[bestehenderIndex] = SPIELER_FORMULAR; else SPIELER.push(SPIELER_FORMULAR);
      await Store.set(SCHLUESSEL.spieler, SPIELER);
      schliesseOverlay(); render(); break;
    }
    case 'spieler-form-loeschen': {
      SPIELER = SPIELER.filter(s => s.id !== SPIELER_FORMULAR.id);
      NEU_AUSWAHL = NEU_AUSWAHL.filter(x => x !== SPIELER_FORMULAR.id);
      await Store.set(SCHLUESSEL.spieler, SPIELER);
      schliesseOverlay(); render(); break;
    }

    case 'einst-coach': EINSTELLUNGEN.coach = !EINSTELLUNGEN.coach; await speichereEinstellungen(); render(); break;
    case 'einst-haptik': EINSTELLUNGEN.haptik = !EINSTELLUNGEN.haptik; await speichereEinstellungen(); render(); break;
    case 'einst-darstellung': EINSTELLUNGEN.darstellung = wert; anwendenTheme(); await speichereEinstellungen(); render(); break;
    case 'daten-export': datenExportieren(); break;
    case 'daten-import': { const inp = document.getElementById('importInput'); if (inp) inp.click(); break; }
    case 'daten-loeschen': zeigeOverlayBestaetigung(TEXTE.einst.allesLoeschenWarnung, 'daten-loeschen-bestaetigt'); break;
    case 'daten-loeschen-bestaetigt': await allesLoeschen(); break;
    case 'preset-loeschen': PRESETS = PRESETS.filter(p => p.id !== id); await Store.set(SCHLUESSEL.presets, PRESETS); render(); break;
    case 'preset-speichern-bestaetigen': {
      const input = document.getElementById('presetNameInput');
      const name = input ? input.value.trim() : '';
      if (!name) { toast('Bitte einen Namen eingeben.'); break; }
      const preset = { id: neueId(), name, regeln: klon(NEU_REGELN) };
      PRESETS.push(preset); NEU_REGELN_PRESET = preset.id;
      await Store.set(SCHLUESSEL.presets, PRESETS);
      schliesseOverlay(); render(); break;
    }

    case 'resume-ja': schliesseOverlay(); BILDSCHIRM = 'spiel'; render(); if (!EINSTELLUNGEN.coachGefragt) zeigeOverlayCoachAngebot(); break;
    case 'resume-nein': {
      AKTIV = null; await speichereAktiv(); schliesseOverlay();
      if (!EINSTELLUNGEN.coachGefragt) zeigeOverlayCoachAngebot();
      break;
    }
    case 'coach-angebot-ja': EINSTELLUNGEN.coach = true; EINSTELLUNGEN.coachGefragt = true; await speichereEinstellungen(); schliesseOverlay(); render(); break;
    case 'coach-angebot-nein': EINSTELLUNGEN.coachGefragt = true; await speichereEinstellungen(); schliesseOverlay(); break;

    case 'undo': await undoSchritt(); break;
    case 'modus-schnell': AKTIV.modus = 'schnell'; await speichereAktiv(); render(); break;
    case 'modus-wuerfel': AKTIV.modus = 'wuerfel'; await speichereAktiv(); render(); break;

    case 'feld-tippen-schnell': zeigeOverlayFeldSchnell(feld); break;
    case 'feld-schnell-wert': {
      const w = parseInt(wert, 10);
      schliesseOverlay();
      await eintragenSchnell(feld, w);
      haptic(true);
      break;
    }
    case 'feld-tippen-wuerfel': await eintragenWuerfel(feld); haptic(true); break;
    case 'feld-korrektur': zeigeOverlayKorrektur(id, feld); break;
    case 'feld-korrektur-wert': {
      const w = parseInt(wert, 10);
      korrekturSpeichernFeld(id, feld, w);
      await speichereAktiv(); schliesseOverlay(); render(); break;
    }
    case 'feld-korrektur-loeschen': {
      korrekturSpeichernFeld(id, feld, null);
      await speichereAktiv(); schliesseOverlay(); render(); break;
    }

    case 'wuerfel-tippen': {
      const i = parseInt(index, 10);
      AKTIV.wuerfel[i] = (AKTIV.wuerfel[i] % 6) + 1;
      AKTIV.wuerfelEingegeben = true;
      await speichereAktiv(); haptic(); render(); break;
    }
    case 'wuerfel-runter': {
      const i = parseInt(index, 10);
      AKTIV.wuerfel[i] = AKTIV.wuerfel[i] === 1 ? 6 : AKTIV.wuerfel[i] - 1;
      AKTIV.wuerfelEingegeben = true;
      await speichereAktiv(); haptic(true); render(); break;
    }
    case 'wuerfel-naechster-wurf': {
      if (AKTIV.wurfNummer < 3) AKTIV.wurfNummer++;
      await speichereAktiv(); render(); break;
    }

    case 'ergebnis-teilen': await ergebnisTeilen(); break;
    case 'best-zeitraum': BEST_ZEITRAUM = wert; render(); break;
    case 'best-tab': BEST_TAB = wert; render(); break;

    case 'overlay-schliessen': schliesseOverlay(); break;
    default: break;
  }
}
function handleChange(action, el) {
  switch (action) {
    case 'neu-preset-wahl': NEU_REGELN_PRESET = el.value; NEU_REGELN = regelnAusPresetName(el.value); render(); break;
    case 'regel-joker': NEU_REGELN.kniffelJoker = el.value; render(); break;
    case 'regel-zweiterbonus': NEU_REGELN.zweiterKniffelBonus = parseInt(el.value, 10); render(); break;
    case 'regel-bonusschwelle': NEU_REGELN.bonusSchwelle = parseInt(el.value, 10) || 0; break;
    case 'regel-bonushoehe': NEU_REGELN.bonusHoehe = parseInt(el.value, 10) || 0; break;
    default: break;
  }
}
function bindeEreignisse() {
  const app = document.getElementById('app');
  const overlays = document.getElementById('overlays');
  let langDruckTimer = null, langDruckAusgefuehrt = false;

  function pointerDown(root) {
    return e => {
      const ziel = e.target.closest('[data-longaction]');
      if (!ziel) return;
      langDruckAusgefuehrt = false;
      langDruckTimer = setTimeout(() => {
        langDruckAusgefuehrt = true;
        handleAction(ziel.dataset.longaction, ziel);
        // Ein Long-Press aendert oft das DOM unter dem Finger (z. B. weil ein
        // Overlay aufgeht). Dadurch feuert der nachfolgende "click" manchmal
        // gar nicht auf demselben Element, und das Unterdruecken dieses
        // Klicks unten wuerde die Markierung nie zuruecksetzen - der naechste,
        // voellig unabhaengige Tipp irgendwo in der App wuerde sonst
        // verschluckt. Ein etwaiger Ghost-Click nach Long-Press feuert immer
        // sofort im selben Moment, daher reicht ein kurzes Zeitfenster, um
        // die Markierung zuverlaessig wieder abzuraeumen.
        setTimeout(() => { langDruckAusgefuehrt = false; }, 60);
      }, 500);
    };
  }
  function pointerAuf() { clearTimeout(langDruckTimer); }

  [app, overlays].forEach(root => {
    root.addEventListener('pointerdown', pointerDown(root));
    root.addEventListener('pointerup', pointerAuf);
    root.addEventListener('pointerleave', pointerAuf);
    root.addEventListener('pointercancel', pointerAuf);
    root.addEventListener('click', e => {
      if (langDruckAusgefuehrt) { langDruckAusgefuehrt = false; e.preventDefault(); e.stopPropagation(); return; }
      if (root === overlays && e.target.classList.contains('overlay')) { schliesseOverlay(); return; }
      const ziel = e.target.closest('[data-action]');
      if (!ziel) return;
      handleAction(ziel.dataset.action, ziel);
    });
    root.addEventListener('change', e => {
      const ziel = e.target.closest('[data-action]');
      if (!ziel) return;
      handleChange(ziel.dataset.action, ziel);
    });
  });
  document.addEventListener('change', e => {
    if (e.target && e.target.id === 'importInput' && e.target.files && e.target.files[0]) {
      datenImportierenAusDatei(e.target.files[0]);
      e.target.value = '';
    }
  });
}

/* =========================================================================
   START — Boot
   ========================================================================= */
async function init() {
  SPIELER = await Store.get(SCHLUESSEL.spieler, []);
  SPIELE = await Store.get(SCHLUESSEL.spiele, []);
  AKTIV = await Store.get(SCHLUESSEL.aktiv, null);
  const gespEinst = await Store.get(SCHLUESSEL.einstellungen, {});
  EINSTELLUNGEN = Object.assign({ coach: false, coachGefragt: false, darstellung: 'dunkel', haptik: true }, gespEinst);
  PRESETS = await Store.get(SCHLUESSEL.presets, []);
  anwendenTheme();
  bindeEreignisse();
  render();
  nachBootPruefen();
}
function nachBootPruefen() {
  if (AKTIV && !AKTIV.beendet) { zeigeOverlayResume(); return; }
  if (!EINSTELLUNGEN.coachGefragt) zeigeOverlayCoachAngebot();
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();
</script>
